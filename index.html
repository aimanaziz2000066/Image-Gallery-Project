<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-content">

            <h1>Image Gallery</h1>

            <p>
                Explore beautiful moments from nature,
                travel, animals and cities.
            </p>

        </div>

    </header>


    <!-- ================= FILTERS ================= -->

    <section class="filters">

        <button class="filter-btn active" data-filter="all">
            All
        </button>

        <button class="filter-btn" data-filter="nature">
            Nature
        </button>

        <button class="filter-btn" data-filter="travel">
            Travel
        </button>

        <button class="filter-btn" data-filter="animals">
            Animals
        </button>

        <button class="filter-btn" data-filter="city">
            City
        </button>

    </section>


    <!-- ================= GALLERY ================= -->

    <main class="gallery">

        <!-- Nature 1 -->

        <div class="gallery-item" data-category="nature">

            <img
                src="images/nature1.png"
                alt="Beautiful Nature"
            >

            <div class="overlay">

                <h3>Beautiful Nature</h3>

                <span>Nature</span>

            </div>

        </div>


        <!-- Nature 2 -->

        <div class="gallery-item" data-category="nature">

            <img
                src="images/nature2.png"
                alt="Mountain View"
            >

            <div class="overlay">

                <h3>Mountain View</h3>

                <span>Nature</span>

            </div>

        </div>


        <!-- Travel 1 -->

        <div class="gallery-item" data-category="travel">

            <img
                src="images/travel1.png"
                alt="Travel Adventure"
            >

            <div class="overlay">

                <h3>Travel Adventure</h3>

                <span>Travel</span>

            </div>

        </div>


        <!-- Travel 2 -->

        <div class="gallery-item" data-category="travel">

            <img
                src="images/travel2.png"
                alt="Beautiful Beach"
            >

            <div class="overlay">

                <h3>Beach Escape</h3>

                <span>Travel</span>

            </div>

        </div>


        <!-- Animal 1 -->

        <div class="gallery-item" data-category="animals">

            <img
                src="images/animal1.png"
                alt="Wild Animal"
            >

            <div class="overlay">

                <h3>Wild Life</h3>

                <span>Animals</span>

            </div>

        </div>


        <!-- Animal 2 -->

        <div class="gallery-item" data-category="animals">

            <img
                src="images/animal2.png"
                alt="Cute Cat"
            >

            <div class="overlay">

                <h3>Cute Cat</h3>

                <span>Animals</span>

            </div>

        </div>


        <!-- City 1 -->

        <div class="gallery-item" data-category="city">

            <img
                src="images/city1.png"
                alt="City Lights"
            >

            <div class="overlay">

                <h3>City Lights</h3>

                <span>City</span>

            </div>

        </div>


        <!-- City 2 -->

        <div class="gallery-item" data-category="city">

            <img
                src="images/city2.png"
                alt="Modern City"
            >

            <div class="overlay">

                <h3>Modern City</h3>

                <span>City</span>

            </div>

        </div>

    </main>


    <!-- ================= LIGHTBOX ================= -->

    <div class="lightbox" id="lightbox">

        <!-- Close -->

        <button
            class="close-btn"
            id="closeBtn"
            aria-label="Close"
        >
            &times;
        </button>


        <!-- Previous -->

        <button
            class="lightbox-btn prev-btn"
            id="prevBtn"
            aria-label="Previous Image"
        >
            &#10094;
        </button>


        <!-- Image -->

        <div class="lightbox-content">

            <img
                id="lightboxImage"
                src=""
                alt="Gallery Image"
            >

            <h2 id="lightboxTitle"></h2>

            <p id="imageCounter"></p>

        </div>


        <!-- Next -->

        <button
            class="lightbox-btn next-btn"
            id="nextBtn"
            aria-label="Next Image"
        >
            &#10095;
        </button>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
